<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#101216"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#191D24" stroke="#2A303A" stroke-width="16"/>
  <!-- The Swift Familiar (Kori) silhouette -->
  <g transform="translate(106, 106) scale(1.5)">
    <!-- Tail feathers -->
    <polygon points="65,145 90,130 75,170" fill="#202630" stroke="#2A303A" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="75,170 95,135 110,165" fill="#101216" stroke="#2A303A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Body -->
    <polygon points="85,60 135,95 90,140 60,110" fill="#1E232B" stroke="#2A303A" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="85,60 135,95 105,105 80,75" fill="#262D38" stroke="#2A303A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Wing -->
    <polygon points="80,75 145,115 125,135 85,95" fill="#2E3744" stroke="#2A303A" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="110,105 155,130 130,140" fill="#A5C96B" fill-opacity="0.9" stroke="#B9D987" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Head & Beak -->
    <polygon points="85,60 115,50 100,75" fill="#2A323D" stroke="#2A303A" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="115,50 135,55 108,63" fill="#A5C96B" stroke="#B9D987" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Eye -->
    <circle cx="98" cy="62" r="4" fill="#A5C96B"/>
    <circle cx="98" cy="62" r="1.5" fill="#101216"/>
    <!-- Perch -->
    <line x1="55" y1="150" x2="145" y2="150" stroke="#2A303A" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
